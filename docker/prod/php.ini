expose_php = Off
memory_limit = 256M
upload_max_filesize = 100M
post_max_size = 110M
max_execution_time = 120
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; errors go to stderr (collected by the container runtime), never to the browser
display_errors = Off
log_errors = On
error_log = /dev/stderr
