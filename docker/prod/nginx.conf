# PLAT-5: nginx in front of php-fpm inside the web role. Listens on 8080 (unprivileged port; TLS terminates upstream).
user www-data;
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_max_body_size 100m;           # document uploads; keep >= php.ini upload_max_filesize
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    upstream php { server 127.0.0.1:9000; }

    server {
        listen 8080 default_server;
        root /var/www/html/public;
        index index.php;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Liveness: answers only if php-fpm itself answers (it does not touch the database).
        location = /healthz {
            access_log off;
            include fastcgi_params;
            fastcgi_param SCRIPT_NAME /fpm-ping;
            fastcgi_param SCRIPT_FILENAME /fpm-ping;
            fastcgi_pass php;
        }

        location / { try_files $uri $uri/ /index.php?$query_string; }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_pass php;
            fastcgi_read_timeout 120s;
        }

        location ~ /\.(?!well-known) { deny all; }
        # ENG-13: Vite output carries a content hash in every file name, so it never changes in place
        location ^~ /build/ { expires 1y; add_header Cache-Control "public, immutable"; access_log off; try_files $uri =404; }
        # FUN-19: the service worker must be re-checked on every visit, or app updates reach devices days late
        location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ { expires 7d; access_log off; try_files $uri =404; }
    }
}
