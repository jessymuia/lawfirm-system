name: dependency-audit
on:
  schedule:
    - cron: '0 5 * * 1'
  pull_request:
    paths: [composer.json, composer.lock, package.json, package-lock.json]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer audit
      - run: npm audit --audit-level=high
