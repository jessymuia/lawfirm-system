<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<style>
  body { font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f9; color: #0f172a; }
  main { max-width: 360px; padding: 24px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }

</style>

<body>
<main>
  <img src="/images/pwa/icon-192.png" alt="">
  <h1>You are offline</h1>
  <p>Open the app once while connected and today's hearings stay available here without a connection.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>

</html>
