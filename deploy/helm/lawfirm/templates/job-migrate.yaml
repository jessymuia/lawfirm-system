# Runs app:install (migrate + permissions/roles + first admin if none) BEFORE every install and upgrade,
# so new pods never start against an old schema. Safe to repeat.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lawfirm.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "lawfirm.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  # Kept for a day (not deleted on success) so a generated first-admin password can still be read from its logs.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "lawfirm.selector" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "lawfirm.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "lawfirm.env" . | nindent 12 }}
