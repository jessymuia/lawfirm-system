{{- if not .Values.existingSecret }}
{{- $_ := required "secrets.appKey is required (or set existingSecret)" .Values.secrets.appKey -}}
{{- $_ := required "secrets.dbPassword is required (or set existingSecret)" .Values.secrets.dbPassword -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lawfirm.fullname" . }}
  labels:
    {{- include "lawfirm.labels" . | nindent 4 }}
  # The migrate hook runs BEFORE normal resources exist on first install, so the chart-managed Secret is a
  # hook too (created first, kept afterwards). Consequence: `helm uninstall` leaves it; delete it by hand.
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  APP_KEY: {{ .Values.secrets.appKey | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  INSTALL_ADMIN_PASSWORD: {{ .Values.secrets.installAdminPassword | quote }}
  MAIL_PASSWORD: {{ .Values.secrets.mailPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  MEILISEARCH_KEY: {{ .Values.secrets.meilisearchKey | quote }}
{{- end }}
